[project]
name = "storygen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "aiofiles>=25.1.0",
    "asyncpg>=0.30.0",
    "bcrypt>=5.0.0",
    "docling>=2.118.0",
    "fastapi[standard]>=0.135.2",
    "pyjwt[crypto]>=2.12.1",
    "python-multipart>=0.0.22",
    "pydantic-settings>=2.12.0",
    "sqlalchemy[asyncio]>=2.0.48",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.15.1",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff.lint]
ignore = ["I001"]
